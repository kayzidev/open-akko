name: Open Akko Windows packages
on:
  workflow_dispatch:
    inputs:
      format:
        description: Windows package format
        required: true
        type: choice
        default: setup
        options: [setup, msi, both, portable]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-desktop
      - name: Check keyboard profiles
        run: python tools/check_studio_profiles.py
      - name: Frontend checks
        working-directory: app
        run: |
          npm run lint
          npx tsc --noEmit
          npm test
      - name: Native checks including WASAPI
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib
      - name: Build Windows packages
        shell: pwsh
        env:
          PACKAGE_FORMAT: ${{ inputs.format }}
        run: ./packaging/windows/build.ps1 -Format $env:PACKAGE_FORMAT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Akko-Studio-windows-x64
          path: |
            artifacts/windows/*setup.exe
            artifacts/windows/*.msi
            artifacts/windows/*.zip
            artifacts/windows/SHA256SUMS.txt
          if-no-files-found: error
