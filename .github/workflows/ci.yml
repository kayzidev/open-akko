name: Client checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-desktop
      - name: Release tooling and model profiles
        run: |
          python tools/check_studio_profiles.py
          python -m unittest discover -s tools -p "test_release.py"
          python -m unittest discover -s tools -p "test_appimage.py"
          python tools/release.py validate
      - name: Frontend checks
        working-directory: app
        run: |
          npm run lint
          npm run build
          npm test
      - name: Native checks
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib
      - name: Layouts and notices
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tools/lint_layouts.py
          cd app
          npx vite build --sourcemap
          python3 ../tools/notices.py --check
      - name: Install Rust audit tool
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Rust vulnerability audit
        if: runner.os == 'Linux'
        run: cargo audit --file app/src-tauri/Cargo.lock
      - name: npm vulnerability audit
        if: runner.os == 'Linux'
        working-directory: app
        run: npm audit --audit-level=low
